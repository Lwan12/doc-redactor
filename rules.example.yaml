# 虚构规则。项目号、申办方和药名都不是真实数据。
# replacement 可省略，缺省按类别走默认占位符。
regex:
  - name: PROJECT_ID
    # 不用 \b：编号紧挨中文时（如「受试者ABC-2026-001」）Python 的 \b 不算边界。
    pattern: '(?<![A-Za-z0-9])ABC-\d{4}-\d{3}(?![A-Za-z0-9])'
    flags: ""
    replacement: "[PROTOCOL]"
wordlists:
  - path: wordlists/sponsors.example.txt
    case_sensitive: false
    category: SPONSOR
    replacement: "[SPONSOR]"
  - path: wordlists/drugs.example.csv
    case_sensitive: true
    category: DRUG
    replacement: "[STUDY DRUG]"
