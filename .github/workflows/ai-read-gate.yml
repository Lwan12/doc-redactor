name: ai-read-gate

# AI 读取门禁（必过）：编造样本经命令行和界面写出后，用 PyMuPDF、pymupdf4llm（含 RapidOCR）、
# pdftotext、python-docx、pandoc 读输出，读出任何一个原词就失败。放在 Linux 上，系统包装得稳。
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  ai-read-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-gate.txt

      - name: Install poppler, tesseract and a CJK font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim fonts-noto-cjk

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-gate.txt

      - name: Locate RapidOCR model folder
        id: rapidocr
        run: echo "dir=$(python -c 'import os, rapidocr; print(os.path.join(os.path.dirname(rapidocr.__file__), "models"))')" >> "$GITHUB_OUTPUT"

      # RapidOCR 第一次运行要联网下识别模型，缓存起来，免得每次都下、下载不稳时整个门禁失败。
      - name: Cache RapidOCR models
        id: models
        uses: actions/cache@v4
        with:
          path: ${{ steps.rapidocr.outputs.dir }}
          key: rapidocr-models-${{ runner.os }}-${{ hashFiles('requirements-gate.txt') }}

      - name: Download RapidOCR models (cache miss, retried)
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3; do
            if python -c "from rapidocr import RapidOCR; RapidOCR()"; then exit 0; fi
            echo "第 $attempt 次下载模型失败，稍后重试"
            sleep 20
          done
          exit 1

      - name: AI read gate
        env:
          PYTHONPATH: src
          AI_GATE_STRICT: "1"
        run: python -m pytest -q tests/test_ai_read_gate.py tests/test_ocr_misread.py tests/test_leak_gate.py
