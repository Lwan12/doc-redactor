[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-redactor"
version = "1.0.0"
description = "Offline redaction for docx, PDF, and raster images"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Lwan12" }]
dependencies = [
    "presidio-analyzer==2.2.364",
    "presidio-image-redactor==0.0.60",
    "PyYAML==6.0.3",
    "python-docx==1.2.0",
    "pymupdf==1.28.2",
    "pytesseract==0.3.13",
    "pillow==12.3.0",
    "tkinterdnd2==0.6.4",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pyinstaller==6.22.3", "reportlab==5.0.1", "tkinterdnd2==0.6.4"]

[project.scripts]
doc-redactor = "doc_redactor.cli:main"
doc-redactor-gui = "doc_redactor.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
